<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Genetic Meal Prep by Empower X3 logo</title>
<desc>A logo combining a DNA double helix with a fork, representing personalized genetic-based meal planning, with the text Genetic Meal Prep by Empower X3 on one line, X3 in gold, and a tagline below reading Healing, whole food catered just for YOU.</desc>
<rect width="680" height="420" fill="#ffffff"/>
<style>
.emerald{stroke:#1f7a5c;}
.emerald-fill{fill:#1f7a5c;}
.gold{stroke:#c99a3d;}
.gold-fill{fill:#c99a3d;}
</style>

<!-- Fork tines forming the outer frame, DNA helix running through the handle -->
<g transform="translate(340,105)">
  <!-- Fork tines -->
  <g class="emerald" fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M -60 -90 L -60 -20 Q -60 10 -30 10 L 30 10 Q 60 10 60 -20 L 60 -90"/>
    <line x1="-30" y1="-90" x2="-30" y2="-10"/>
    <line x1="0" y1="-90" x2="0" y2="-10"/>
    <line x1="30" y1="-90" x2="30" y2="-10"/>
  </g>
  <!-- Fork neck into handle -->
  <path class="emerald" fill="none" stroke-width="10" stroke-linecap="round" d="M 0 10 L 0 55"/>

  <!-- DNA double helix as the handle -->
  <g stroke-width="4" fill="none">
    <path class="emerald" d="M -22 55 C -22 85 22 85 22 115 C 22 145 -22 145 -22 175"/>
    <path class="gold" d="M 22 55 C 22 85 -22 85 -22 115 C -22 145 22 145 22 175"/>
    <line class="emerald" x1="-18" y1="65" x2="18" y2="65" stroke-width="3"/>
    <line class="gold" x1="-14" y1="85" x2="14" y2="85" stroke-width="3"/>
    <line class="emerald" x1="-8" y1="102" x2="8" y2="102" stroke-width="3"/>
    <line class="gold" x1="-8" y1="128" x2="8" y2="128" stroke-width="3"/>
    <line class="emerald" x1="-14" y1="145" x2="14" y2="145" stroke-width="3"/>
    <line class="gold" x1="-18" y1="165" x2="18" y2="165" stroke-width="3"/>
  </g>
</g>

<!-- Wordmark: single line, X3 in gold -->
<text x="340" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" class="emerald-fill">Genetic Meal Prep <tspan class="gold-fill" font-weight="400" font-style="italic">by</tspan> Empower <tspan class="gold-fill" font-weight="700" font-style="normal">X3</tspan></text>

<line x1="220" y1="345" x2="460" y2="345" class="gold" stroke-width="1.5"/>

<!-- Tagline -->
<text x="340" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" letter-spacing="0.5" class="gold-fill">Healing, whole food catered just for YOU</text>
</svg>
